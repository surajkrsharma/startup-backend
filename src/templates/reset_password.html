<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your {{appName}} verification code</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
            <tr>
              <td style="padding:28px 32px 8px;">
                <h1 style="margin:0;font-size:20px;line-height:28px;color:#111827;">Verify it&rsquo;s you</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px;font-size:15px;line-height:22px;color:#4b5563;">
                <p style="margin:0 0 20px;">Use this code to complete the {{purpose}} step. It expires in 10 minutes and works once.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:4px 32px 28px;">
                <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:20px;text-align:center;">
                  <span style="font-size:32px;font-weight:700;letter-spacing:8px;color:#111827;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">{{otp}}</span>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;font-size:13px;line-height:20px;color:#6b7280;">
                <p style="margin:0;">If you did not request this, you can ignore this email &mdash; nothing has changed on your account.</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#9ca3af;">{{appName}}</p>
        </td>
      </tr>
    </table>
  </body>
</html>
